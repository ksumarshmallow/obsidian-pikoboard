stages:
  - test
  - secret-detection
variables:
  SECRET_DETECTION_ENABLED: 'true'
secret_detection:
  stage: secret-detection
include:
  - template: Security/Secret-Detection.gitlab-ci.yml

plugin_tests:
  stage: test
  image: node:22-bookworm-slim
  script:
    - npm run release:check
    - npm test
    - npm run check
    - npm run release:pack
  artifacts:
    name: 'PikoBoard-$CI_COMMIT_SHORT_SHA'
    paths:
      - dist/pikoboard/
